<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'unsafe-inline'; script-src-attr 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'">
  <title>Flow alignment prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    /* ---- Sketchbook design system. Adjust product markup, keep these tokens. ---- */
    :root {
      --ink: #27272a; --ink-soft: #71717a; --line: #52525b; --paper: #f8f8f6;
      --spotlight: #fbbf24; --danger: #b91c1c;
      --open: #f59e0b; --assumed: #60a5fa; --confirmed: #4ade80; --moot: #71717a;
      --sketch-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh; font-size: 18px; color: var(--ink);
      display: grid; grid-template-columns: 292px minmax(0, 1fr);
      background-color: var(--paper);
      background-image: radial-gradient(#d4d4d8 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      font-family: 'Patrick Hand', 'Comic Neue', cursive;
    }
    button, input, select, textarea { font: inherit; }
    small { font-size: 13px; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex="-1"]:focus-visible {
      outline: 3px solid var(--spotlight); outline-offset: 3px;
    }

    /* ---- Observer rail. Tooling, not product: system typography, own column. ---- */
    .observer-hud {
      position: sticky; top: 0; align-self: start; z-index: 100;
      height: 100vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
      padding: 12px 13px;
      display: grid; gap: 10px; align-content: start;
      color: #fafafa; background: #18181b; border-right: 3px solid var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .observer-hud > *, .hud-current, .route-details { min-width: 0; }
    .hud-section { display: grid; gap: 5px; }
    .hud-label { color: #a1a1aa; font: 700 13px/1.4 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .hud-select { width: 100%; padding: 5px 7px; font-size: 13px; color: #fff; background: #27272a; border: 1px solid var(--ink-soft); border-radius: 5px; }
    .hud-flow-title { font: 700 14px/1.4 system-ui, sans-serif; }
    .hud-text { margin: 0; font-size: 13px; line-height: 1.55; color: #e4e4e7; }
    .hud-note { margin: 0; font-size: 13px; line-height: 1.5; color: #a1a1aa; }
    .hud-section-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
    .hud-controls { display: grid; gap: 7px; }
    .hud-button { min-height: 36px; padding: 6px 9px; font: 600 13px/1.35 system-ui, sans-serif; color: #fafafa; background: #27272a; border: 1px solid #52525b; border-radius: 5px; }
    .hud-button:hover:not(:disabled) { border-color: #a1a1aa; }
    .hud-button:disabled { opacity: .4; cursor: not-allowed; }
    .hud-button[data-pending="true"] { border-color: var(--spotlight); }
    .hud-button[aria-pressed="true"], .hud-button[aria-expanded="true"] { color: #18181b; background: var(--spotlight); border-color: var(--spotlight); }
    .hud-disclosure > summary, .route-details > summary, .entry-details > summary {
      cursor: pointer; list-style: none; color: #a1a1aa; font: 600 13px/1.5 system-ui, sans-serif;
    }
    .hud-disclosure > summary::-webkit-details-marker, .route-details > summary::-webkit-details-marker,
    .entry-details > summary::-webkit-details-marker { display: none; }
    .hud-disclosure > summary::before, .route-details > summary::before,
    .entry-details > summary::before { content: '＋ '; color: var(--spotlight); }
    .hud-disclosure[open] > summary::before, .route-details[open] > summary::before,
    .entry-details[open] > summary::before { content: '− '; }
    .hud-disclosure { display: grid; width: 100%; min-width: 0; gap: 7px; }
    .hud-disclosure > summary {
      display: grid; width: 100%; min-width: 0;
      grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline;
    }
    .hud-disclosure > summary .hud-label:first-of-type { min-width: 0; }
    .hud-disclosure[open] > summary { margin-bottom: 1px; }
    [hidden] { display: none !important; }

    /* ---- Where the journey starts, and on whose authority. "We assumed this is
       where people begin" is exactly the
       kind of claim a client is here to correct. ---- */
    .entry-block { display: grid; gap: 5px; padding: 8px 10px; background: #27272a; border-left: 3px solid var(--spotlight); border-radius: 0 6px 6px 0; }
    .entry-basis { justify-self: start; padding: 1px 7px; font: 700 13px/1.6 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #18181b; border-radius: 999px; background: var(--moot); }
    .entry-basis[data-basis="observed"] { background: var(--confirmed); }
    .entry-basis[data-basis="provided"] { background: var(--assumed); }
    .entry-basis[data-basis="assumed"] { background: var(--open); }
    .entry-list { margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.5; color: #a1a1aa; }
    .entry-details { margin-top: 1px; }
    .entry-details .entry-list { margin-top: 4px; }

    /* ---- The step map. Position, shape, and direct navigation between screens. ---- */
    .stepper { display: grid; gap: 3px; }
    .step { width: 100%; display: flex; gap: 6px; padding: 5px 9px; text-align: left; font: 600 13px/1.4 system-ui, sans-serif; color: #71717a; background: transparent; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
    .step:hover { color: #fff; border-color: #3f3f46; }
    /* Alternative outcomes of one step are siblings, not consecutive steps. */
    .step[data-branch="true"] { margin-left: 13px; }
    .step[data-active="true"] { color: #18181b; background: var(--spotlight); border-color: var(--spotlight); }
    .step-mark { flex: none; width: 13px; color: #52525b; }
    .step[data-active="true"] .step-mark { color: #18181b; }
    .step-name { flex: 1 1 auto; }
    .step-focus { flex: none; color: var(--spotlight); }
    .step[data-active="true"] .step-focus { color: #18181b; }
    .route-details { display: grid; gap: 6px; }
    .route-details[open] > summary { margin-bottom: 5px; }

    /* ---- Product shell. Context around the flow; live only when a state says so. ---- */
    .app-shell { width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 18px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
    .sketch-card { background: #fff; border: 2px solid var(--ink); border-radius: var(--sketch-radius); box-shadow: 2px 3px 0 rgba(0, 0, 0, .08); }
    .product-context { opacity: .5; pointer-events: none; user-select: none; }
    .shell-header { grid-column: 1 / -1; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; }
    .shell-nav { padding: 15px; min-height: 400px; display: grid; align-content: start; gap: 2px; }
    .shell-link { padding: 8px 10px; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px dashed #a1a1aa; cursor: default; }
    /* A link that leads somewhere in this step says so; the mask below does the
       rest of the talking. */
    .shell-link[data-live="true"] { cursor: pointer; }

    /* ---- Interaction scope. The mask always covers what this step does not use;
       each state names one or, when the decision spans separated evidence, a
       small set of product regions as its spotlight.

       viewport — the named decision/action region is the one hole, ringed amber.
       shell    — when navigation is the only action, its single routed link is
                  the one hole and receives the ring. If the page also offers a
                  declared action, that region keeps the hole without the ring
                  and routed navigation is punched through beside it.

       A control that leads nowhere here stays under the mask. The walkthrough is
       for confirming this journey, not for discovering which chrome is
       decorative: getting stuck on a dead link spends the meeting on the
       prototype instead of on the flow. ---- */
    #product-viewport {
      position: relative; z-index: 10; min-height: 520px; padding: 28px; background: #fff;
      border: 3px solid var(--ink); border-radius: var(--sketch-radius);
      box-shadow: 0 22px 45px rgba(0, 0, 0, .22);
    }
    #interaction-mask { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    .mask-pane { position: fixed; background: rgba(39, 39, 42, .58); pointer-events: auto; }
    .spotlight-ring {
      position: fixed; border: 4px solid var(--spotlight); border-radius: 10px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .28); pointer-events: none;
    }
    body[data-scope="shell"][data-focus-source="product"] .spotlight-ring { display: none; }
    /* No filter or opacity on this container: either would open a stacking
       context and trap the punched-through links underneath the mask. */
    body[data-scope="shell"] .product-context { opacity: 1; user-select: auto; }
    /* Punched through: painted above the mask on its own opaque background, and
       the only place in the shell that ever receives pointer events, so future
       chrome cannot become silently interactive. */
    body[data-scope="shell"] .product-context [data-nav][data-live="true"] {
      position: relative; z-index: 21; background: #fff; pointer-events: auto;
    }
    body[data-scope="shell"] .product-context [data-nav][data-live="true"]:hover { background: #fef3c7; }

    .btn-sketch-primary, .btn-sketch-secondary, .btn-sketch-danger { min-height: 42px; padding: 7px 16px; border: 2px solid var(--ink); border-radius: var(--sketch-radius); box-shadow: 2px 2px 0 rgba(0, 0, 0, .18); }
    .btn-sketch-primary { color: #fff; background: #18181b; }
    .btn-sketch-secondary { color: var(--ink); background: #fff; }
    .btn-sketch-danger { color: var(--danger); background: #fff1f2; border-color: var(--danger); }

    @media (max-width: 900px) {
      body { grid-template-columns: minmax(0, 1fr); }
      .observer-hud {
        position: relative; top: auto; width: 100vw; max-width: 100vw;
        height: auto; max-height: min(46vh, 420px); box-sizing: border-box;
        border-right: 0; border-bottom: 3px solid var(--ink);
      }
      .hud-current { order: 1; }
      .hud-scenario { order: 2; }
      .hud-entry { order: 3; }
      .hud-step-note { order: 4; }
      .stepper { display: flex; min-width: 0; max-width: 100%; overflow-x: auto; }
      .step { white-space: nowrap; border-color: #52525b; border-radius: 999px; }
    }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; padding: 18px 12px; }
      .shell-header { grid-column: auto; }
      .shell-nav { min-height: 0; grid-auto-flow: column; overflow-x: auto; }
      #product-viewport { padding: 22px 18px; min-height: 460px; }
    }

    /* ---- Product-specific additions go below this line. ---- */


  </style>
</head>
<body>

<!-- ========================================================================
     OBSERVER RAIL — the people running the walkthrough, never the product.
     Restart, flow selector, entry declaration, direct-navigation step map,
     step note, and scenario live
     here and nowhere else.
     ======================================================================== -->
<aside class="observer-hud" id="observer-hud" aria-label="Flow navigator">
  <div class="hud-controls" aria-label="Walkthrough controls">
    <button class="hud-button" id="reset-flow" type="button">Restart</button>
  </div>

  <div class="hud-section">
    <span class="hud-label">Flow</span>
    <select class="hud-select" id="flow-selector" aria-label="Select flow"></select>
    <span class="hud-flow-title" id="flow-title" hidden></span>
  </div>

  <details class="hud-section hud-disclosure hud-scenario">
    <summary><span class="hud-label">Purpose</span></summary>
    <p class="hud-text" id="flow-task"></p>
  </details>

  <details class="hud-section hud-disclosure hud-entry">
    <summary><span class="hud-label">Entry</span></summary>
    <div class="entry-block" id="entry-block">
      <span class="entry-basis" id="entry-basis"></span>
      <p class="hud-text" id="entry-why"></p>
      <details class="entry-details" id="entry-details">
        <summary id="entry-preconditions-summary">Preconditions</summary>
        <ul class="entry-list" id="entry-preconditions"></ul>
      </details>
    </div>
  </details>

  <div class="hud-section hud-current">
    <details class="route-details" id="route-details" open>
      <summary>View route map</summary>
      <nav class="stepper" id="state-stepper" aria-label="Step map"></nav>
    </details>
  </div>

  <details class="hud-section hud-disclosure hud-step-note">
    <summary><span class="hud-label">This step</span></summary>
    <p class="hud-text" id="state-instruction"></p>
  </details>

</aside>

<!-- ========================================================================
     PRODUCT SHELL — believable context, dimmed and non-interactive.
     Replace the copy with the real product's chrome. Add no data-goto here.
     ======================================================================== -->
<div class="app-shell" id="app-shell">
  <header class="sketch-card shell-header product-context">
    <strong>[PRODUCT LOGO]</strong>
    <button class="shell-link" type="button" data-nav="account">Workspace / account menu</button>
  </header>
  <nav class="sketch-card shell-nav product-context" aria-label="Product navigation">
    <button class="shell-link" type="button" data-nav="overview">Overview</button>
    <button class="shell-link" type="button" data-nav="target">Target area</button>
    <button class="shell-link" type="button" data-nav="records">Records</button>
    <button class="shell-link" type="button" data-nav="settings">Settings</button>
  </nav>
  <main id="product-viewport" aria-live="polite"></main>
</div>

<div id="interaction-mask" aria-hidden="true">
  <span class="mask-pane" data-mask-pane="top"></span>
  <span class="mask-pane" data-mask-pane="right"></span>
  <span class="mask-pane" data-mask-pane="bottom"></span>
  <span class="mask-pane" data-mask-pane="left"></span>
  <span id="spotlight-ring" class="spotlight-ring"></span>
</div>

<!-- ========================================================================
     SOURCE OF TRUTH — paste the exact contents of flow.json here.
     ======================================================================== -->
<script id="flow-spec" type="application/json">
{
  "version": 1,
  "flows": [
    {
      "id": "sample-flow",
      "title": "Replace with the journey name",
      "task": "Replace with the scenario: what the person is trying to do, and why.",
      "entry": {
        "state": "app-home",
        "basis": "assumed",
        "why": "Replace with why a real user would be standing here when the journey starts.",
        "preconditions": [
          "Replace with a step this artifact deliberately skips, such as signing in."
        ]
      },
      "focus": [
        "decision"
      ],
      "review": [
        {
          "aspect": "entry-point",
          "status": "assumed",
          "proposal": "The journey starts on the product home, already signed in.",
          "states": [
            "app-home"
          ],
          "question": "Is this where people actually are when they start, or do they arrive from a link or an email?",
          "alternatives": [
            "Arriving from a notification straight into the record."
          ]
        },
        {
          "aspect": "navigation",
          "status": "open",
          "proposal": "The route is home, then records, then the record itself.",
          "states": [
            "app-home",
            "record-list"
          ],
          "question": "Is this where people would look for it, and is anything missing from the route?"
        },
        {
          "aspect": "branches",
          "status": "open",
          "proposal": "One decision with two outcomes: go ahead, or back out.",
          "states": [
            "decision"
          ],
          "question": "Is there a third thing someone would reasonably want to do here?",
          "alternatives": [
            "A defer-and-remind-me option instead of a plain decline."
          ]
        },
        {
          "aspect": "failure-recovery",
          "status": "not-applicable",
          "proposal": "This journey does not include a technical failure; model one as a separate complete flow when it needs review.",
          "states": []
        },
        {
          "aspect": "ending-state",
          "status": "assumed",
          "proposal": "Both outcomes return to the record list, which shows the new state of the record.",
          "states": [
            "record-list-updated",
            "record-list-unchanged"
          ],
          "question": "Should the list show what changed, or is a silent update enough?"
        }
      ],
      "states": [
        {
          "id": "app-home",
          "title": "App home",
          "step": 1,
          "scope": "shell",
          "spotlight": "home-context",
          "navTargets": {
            "records": "record-list"
          },
          "instruction": "Start where a real user would be standing, not on the screen under discussion.",
          "transitions": [
            "record-list"
          ]
        },
        {
          "id": "record-list",
          "title": "Records",
          "step": 2,
          "scope": "shell",
          "spotlight": "record-row",
          "navTargets": {
            "overview": "app-home"
          },
          "instruction": "The navigation that gets them there is part of what you are confirming.",
          "transitions": [
            "decision",
            "app-home"
          ]
        },
        {
          "id": "decision",
          "title": "The decision",
          "step": 3,
          "spotlight": "decision-actions",
          "instruction": "This is the screen the flow exists to settle.",
          "transitions": [
            "done",
            "declined",
            "record-list"
          ]
        },
        {
          "id": "done",
          "title": "Confirmed",
          "step": 4,
          "terminal": true,
          "spotlight": "confirmed-result",
          "instruction": "What the product shows when they go ahead.",
          "outcome": {
            "happened": "The record was approved.",
            "changed": [
              "Record status: pending -> approved"
            ],
            "continuation": "record-list-updated"
          },
          "transitions": [
            "record-list-updated"
          ]
        },
        {
          "id": "declined",
          "title": "Backed out",
          "step": 4,
          "terminal": true,
          "spotlight": "declined-result",
          "instruction": "The other branch. Same step number, so the rail draws them as alternatives.",
          "outcome": {
            "happened": "Nothing was approved; the record was left alone.",
            "changed": [
              "Record status: unchanged, still pending"
            ],
            "continuation": "record-list-unchanged"
          },
          "transitions": [
            "record-list-unchanged"
          ]
        },
        {
          "id": "record-list-updated",
          "title": "Records — after approving",
          "step": 5,
          "spotlight": "updated-record",
          "instruction": "The postcondition. The same list, now showing what the decision changed.",
          "transitions": []
        },
        {
          "id": "record-list-unchanged",
          "title": "Records — after backing out",
          "step": 5,
          "spotlight": "unchanged-record",
          "instruction": "The other postcondition. Nothing changed, and the product says so.",
          "transitions": []
        }
      ]
    }
  ]
}
</script>

<!-- ========================================================================
     STATE VIEWS — one <template> per state, keyed by data-flow + data-state.
     hypothesis and successSignal are omitted above on purpose: fill them in only
     when the artifact will be used for a moderated participant session.
     Product copy and product actions only. Actions use data-goto="<state-id>"
     and every target must be a declared transition from that state. Each state
     has one wrapper whose data-spotlight matches flow.json; every action for the
     step stays inside that focused region.
     A technical-failure journey is a separate complete flow, not a rail control.
     ======================================================================== -->
<div id="state-views" hidden>
  <template data-flow="sample-flow" data-state="app-home">
    <p class="view-eyebrow">Home</p>
    <h1 class="view-title">Replace with the product's home screen</h1>
    <div class="record" data-spotlight="home-context"><span><strong>Something recent</strong><br><small>Believable, specific detail</small></span><span><small>Status</small></span></div>
    <p class="note">This step exists so the walker navigates to the flow instead of appearing inside it. The left navigation is live here.</p>
  </template>

  <template data-flow="sample-flow" data-state="record-list">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the list they arrive at</h1>
    <div class="record" data-spotlight="record-row">
      <span><strong>The record this flow is about</strong><br><small>Specific enough to be wrong</small></span>
      <button class="btn-sketch-secondary" type="button" data-goto="decision">Open</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="decision">
    <p class="view-eyebrow">Records / Detail</p>
    <h1 class="view-title">Replace with the decision screen</h1>
    <p class="note">Put the trade-off, friction, or value proposition being confirmed right here, in product language.</p>
    <div class="actions" data-spotlight="decision-actions">
      <button class="btn-sketch-primary" type="button" data-goto="done">Confirm</button>
      <button class="btn-sketch-danger" type="button" data-goto="declined">Decline</button>
      <button class="btn-sketch-secondary" type="button" data-goto="record-list">Go back</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="done">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the confirmed outcome</h1>
    <p class="note">State the result the way the product would, then offer a natural next step.</p>
    <div class="actions" data-spotlight="confirmed-result">
      <button class="btn-sketch-secondary" type="button" data-goto="record-list-updated">Back to records</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="declined">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the other outcome</h1>
    <p class="note">Every branch lands somewhere real. "What if they say no?" is the question the room always asks.</p>
    <div class="actions" data-spotlight="declined-result">
      <button class="btn-sketch-secondary" type="button" data-goto="record-list-unchanged">Back to records</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="record-list-updated">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the list, showing the change</h1>
    <div class="record" data-spotlight="updated-record"><span><strong>The record this flow is about</strong><br><small>Now says approved, with whatever else the decision changed</small></span><span><small>Approved</small></span></div>
    <p class="note">Coming back to the same screen the walker already saw would quietly undo the outcome. This is the same list after the decision.</p>
  </template>

  <template data-flow="sample-flow" data-state="record-list-unchanged">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the list, still unchanged</h1>
    <div class="record" data-spotlight="unchanged-record"><span><strong>The record this flow is about</strong><br><small>Still waiting, and the product says why nothing happened</small></span><span><small>Pending</small></span></div>
    <p class="note">Backing out is also an outcome. Say plainly that nothing was changed.</p>
  </template>
</div>

<!-- ========================================================================
     ENGINE — generic and data driven. Do not edit when building a prototype.
     ======================================================================== -->
<script>
  const BASIS_LABELS = {
    'observed': 'Observed',
    'provided': 'Provided',
    'assumed': 'Assumed'
  };
  const FlowPrototype = {
    spec: null,
    flowId: null,
    stateId: null,
    liveProductActions: [],
    liveNavigation: [],

    init() {
      this.spec = JSON.parse(document.getElementById('flow-spec').textContent);
      this.selector = document.getElementById('flow-selector');
      this.stepper = document.getElementById('state-stepper');
      this.viewport = document.getElementById('product-viewport');
      this.shell = document.getElementById('app-shell');
      this.mask = document.getElementById('interaction-mask');
      this.maskPanes = Object.fromEntries(
        Array.from(this.mask.querySelectorAll('[data-mask-pane]'))
          .map((pane) => [pane.dataset.maskPane, pane])
      );
      this.spotlightRing = document.getElementById('spotlight-ring');
      this.spotlightTargets = [this.viewport];
      this.routeDetails = document.getElementById('route-details');

      this.selector.innerHTML = this.spec.flows
        .map((flow) => `<option value="${flow.id}">${this.escapeHtml(flow.title)}</option>`)
        .join('');
      const single = this.spec.flows.length === 1;
      this.selector.hidden = single;
      document.getElementById('flow-title').hidden = !single;

      this.selector.addEventListener('change', () => this.selectFlow(this.selector.value));
      // Restart returns to the entry point, never to the middle of the journey.
      document.getElementById('reset-flow').addEventListener('click', () => this.selectFlow(this.flowId));

      this.stepper.addEventListener('click', (event) => {
        const step = event.target.closest('[data-jump]');
        if (step) this.jumpTo(step.dataset.jump);
      });

      window.addEventListener('resize', () => this.updateSpotlight());
      window.addEventListener('scroll', () => this.updateSpotlight(), true);

      // Product actions inside the page under discussion. Capture the event so
      // an undeclared anchor or custom interactive element cannot follow its
      // native action before the mask or the delegated handler gets a say.
      this.viewport.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-goto]');
        if (!trigger || !this.liveProductActions.includes(trigger)) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        this.goTo(trigger.dataset.goto);
      }, true);

      // Product navigation. A shell link is live only where the current state
      // says it leads somewhere, so one shared shell serves every flow. Capture
      // this too so an undeclared anchor cannot navigate by mouse or keyboard.
      this.shell.addEventListener('click', (event) => {
        const link = event.target.closest('[data-nav]');
        if (!link) return;
        if (!this.liveNavigation.includes(link)) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        this.goTo((this.state().navTargets || {})[link.dataset.nav]);
      }, true);

      // Click is the final guard for keyboard activation in normal controls.
      // Keydown also covers custom interactive content such as a role=button
      // element or a summary/details control that has no click default.
      this.shell.addEventListener('keydown', (event) => {
        const control = event.target.closest(
          'button, a[href], area[href], input, select, textarea, summary, [contenteditable="true"], [tabindex], [role="button"], [role="link"], audio[controls], video[controls], iframe, object, embed'
        );
        if (!control) return;
        const action = control.closest('[data-goto]');
        const navigation = control.closest('[data-nav]');
        if ((action && this.liveProductActions.includes(action))
          || (navigation && this.liveNavigation.includes(navigation))) return;
        event.preventDefault();
        event.stopPropagation();
      }, true);

      this.selectFlow(this.spec.flows[0].id);
    },

    flow() {
      return this.spec.flows.find((flow) => flow.id === this.flowId);
    },

    state() {
      return this.flow().states.find((state) => state.id === this.stateId);
    },

    selectFlow(flowId) {
      const flow = this.spec.flows.find((item) => item.id === flowId);
      if (!flow) throw new Error(`Unknown flow: ${flowId}`);
      this.flowId = flow.id;
      this.stateId = flow.entry.state;
      this.selector.value = flow.id;
      this.routeDetails.open = true;
      document.title = flow.title;
      document.getElementById('flow-title').textContent = flow.title;
      document.getElementById('flow-task').textContent = flow.task;
      this.renderEntry(flow);
      this.render();
    },

    // The walked path. Only transitions the specification declares.
    goTo(stateId) {
      const current = this.state();
      if (!current.transitions.includes(stateId)) {
        throw new Error(`Undeclared transition: ${current.id} -> ${stateId}`);
      }
      this.stateId = stateId;
      this.render();
      this.focusView();
    },

    jumpTo(stateId) {
      if (!this.flow().states.some((state) => state.id === stateId)) {
        throw new Error(`Unknown state: ${stateId}`);
      }
      this.stateId = stateId;
      this.render();
      this.focusView();
    },

    renderEntry(flow) {
      const basis = document.getElementById('entry-basis');
      basis.dataset.basis = flow.entry.basis;
      basis.textContent = BASIS_LABELS[flow.entry.basis] || flow.entry.basis;
      document.getElementById('entry-why').textContent = flow.entry.why;
      const preconditions = flow.entry.preconditions || [];
      const entryDetails = document.getElementById('entry-details');
      entryDetails.hidden = !preconditions.length;
      entryDetails.open = false;
      document.getElementById('entry-preconditions-summary').textContent = preconditions.length
        ? `${preconditions.length} precondition${preconditions.length === 1 ? '' : 's'}`
        : 'No skipped steps';
      document.getElementById('entry-preconditions').innerHTML = preconditions
        .map((item) => `<li>${this.escapeHtml(item)}</li>`)
        .join('');
    },

    escapeHtml(value) {
      const span = document.createElement('span');
      span.textContent = value == null ? '' : String(value);
      return span.innerHTML;
    },

    render() {
      const flow = this.flow();
      const state = this.state();
      document.getElementById('state-instruction').textContent = state.instruction;
      // Steps that share a number are alternative outcomes, not sequential steps.
      const focus = new Set(flow.focus || []);
      const ordered = flow.states.slice().sort((a, b) => a.step - b.step);
      const counts = ordered.reduce((all, item) => ({ ...all, [item.step]: (all[item.step] || 0) + 1 }), {});
      let seen = {};
      this.stepper.innerHTML = ordered
        .map((item) => {
          const branch = counts[item.step] > 1;
          seen[item.step] = (seen[item.step] || 0) + 1;
          const last = seen[item.step] === counts[item.step];
          const mark = branch ? (last ? '└' : '├') : `${item.step}.`;
          const marker = focus.has(item.id) ? '<span class="step-focus">◆</span>' : '';
          return `<button class="step" type="button" data-jump="${item.id}" data-branch="${branch}"`
            + ` data-active="${item.id === state.id}"`
            + ` aria-current="${item.id === state.id ? 'step' : 'false'}">`
            + `<span class="step-mark">${mark}</span><span class="step-name">${this.escapeHtml(item.title)}</span>${marker}</button>`;
        })
        .join('');

      // Interaction scope for this state, and which shell links lead somewhere.
      document.body.dataset.scope = state.scope === 'shell' ? 'shell' : 'viewport';
      const navTargets = state.navTargets || {};
      document.querySelectorAll('[data-nav]').forEach((link) => {
        const target = navTargets[link.dataset.nav];
        link.dataset.live = String(Boolean(target && state.transitions.includes(target)));
      });

      const view = document.querySelector(`template[data-flow="${flow.id}"][data-state="${state.id}"]`);
      if (!view) throw new Error(`Missing state view: ${flow.id}/${state.id}`);
      this.viewport.replaceChildren(view.content.cloneNode(true));
      const spotlightKeys = Array.isArray(state.spotlights) && state.spotlights.length
        ? state.spotlights
        : (state.spotlight ? [state.spotlight] : []);
      const declaredSpotlights = spotlightKeys
        .map((key) => Array.from(this.viewport.querySelectorAll('[data-spotlight]'))
          .find((element) => element.dataset.spotlight === key))
        .filter(Boolean);
      const productTargets = declaredSpotlights.length ? declaredSpotlights : [this.viewport];
      const liveNavigation = Array.from(this.shell.querySelectorAll('[data-nav][data-live="true"]'));
      // querySelectorAll does not include the element it is called on. Keep the
      // spotlight root in the candidate list so a button can be both the focus
      // region and the declared action.
      const liveProductActions = productTargets.flatMap((target) => {
        const actions = target.matches('[data-goto]') ? [target] : [];
        return actions.concat(Array.from(target.querySelectorAll('[data-goto]')))
          .filter((control) => state.transitions.includes(control.dataset.goto));
      });
      this.liveProductActions = [...new Set(liveProductActions)];
      this.liveNavigation = liveNavigation;
      const spotlightOffersAction = this.liveProductActions.length > 0;
      const navigationOnly = state.scope === 'shell'
        && liveNavigation.length === 1
        && !spotlightOffersAction;
      document.body.dataset.focusSource = navigationOnly ? 'navigation' : 'product';
      this.spotlightTargets = navigationOnly ? [liveNavigation[0]] : productTargets;

      // The mask must constrain keyboard interaction as well as pointer input.
      // Disable every product control, then enable only declared actions inside
      // the current spotlight and routed navigation exposed by this state.
      const productControls = Array.from(this.shell.querySelectorAll(
        'button, a[href], area[href], input, select, textarea, summary, [contenteditable="true"], [tabindex], [role="button"], [role="link"], audio[controls], video[controls], iframe, object, embed'
      )).filter((control) => control !== this.viewport);
      const liveControls = [
        ...this.liveProductActions,
        ...(state.scope === 'shell' ? liveNavigation : [])
      ];
      const liveControlSet = new Set(liveControls);
      productControls.forEach((control) => {
        control.tabIndex = -1;
        control.setAttribute('aria-disabled', 'true');
        control.style.pointerEvents = 'none';
        if ('disabled' in control) control.disabled = true;
      });
      liveControls.forEach((control) => {
        if (!liveControlSet.has(control)) return;
        control.tabIndex = 0;
        control.removeAttribute('aria-disabled');
        control.style.pointerEvents = '';
        if ('disabled' in control) control.disabled = false;
      });
      requestAnimationFrame(() => {
        this.ensureSpotlightVisible();
        this.updateSpotlight();
      });
    },

    ensureSpotlightVisible() {
      // A multi-region step may pair context with a distant action. On a narrow
      // viewport, keep the actionable region visible so the walkthrough cannot
      // expose evidence yet hide the only way forward.
      const actionTarget = this.spotlightTargets
        .map((target) => target.matches('[data-goto]') ? target : target.querySelector('[data-goto]'))
        .find(Boolean);
      const spotlightTarget = actionTarget
        ? this.spotlightTargets.find((target) => target === actionTarget || target.contains(actionTarget))
        : this.spotlightTargets[0];
      if (!spotlightTarget || spotlightTarget === this.viewport) return;
      const target = spotlightTarget.getBoundingClientRect();
      const shell = this.shell.getBoundingClientRect();
      const visibleTop = Math.max(0, shell.top);
      const visibleBottom = Math.min(window.innerHeight, shell.bottom);
      const inset = 24;
      const visibleHeight = Math.max(0, visibleBottom - visibleTop - inset * 2);
      if (target.top < visibleTop + inset || target.bottom > visibleBottom - inset) {
        const scrollTarget = target.height > visibleHeight && actionTarget
          ? actionTarget
          : spotlightTarget;
        scrollTarget.scrollIntoView({ block: 'center', inline: 'nearest' });
      }
    },

    updateSpotlight() {
      const targets = this.spotlightTargets.filter((target) => target && target.isConnected);
      if (!targets.length) {
        this.mask.hidden = true;
        return;
      }
      this.mask.hidden = false;
      const shell = this.shell.getBoundingClientRect();
      const bounds = {
        left: Math.max(0, shell.left),
        top: Math.max(0, shell.top),
        right: Math.min(window.innerWidth, shell.right),
        bottom: Math.min(window.innerHeight, shell.bottom)
      };
      const setRect = (element, left, top, right, bottom) => {
        element.style.left = `${left}px`;
        element.style.top = `${top}px`;
        element.style.width = `${Math.max(0, right - left)}px`;
        element.style.height = `${Math.max(0, bottom - top)}px`;
      };
      const holes = targets.map((target) => {
        const rect = target.getBoundingClientRect();
        const padding = target === this.viewport ? 0 : 10;
        const left = Math.min(bounds.right, Math.max(bounds.left, rect.left - padding));
        const top = Math.min(bounds.bottom, Math.max(bounds.top, rect.top - padding));
        return {
          left,
          top,
          right: Math.max(left, Math.min(bounds.right, rect.right + padding)),
          bottom: Math.max(top, Math.min(bounds.bottom, rect.bottom + padding))
        };
      });

      this.mask.querySelectorAll('[data-dynamic-mask]').forEach((pane) => pane.remove());
      Object.values(this.maskPanes).forEach((pane) => { pane.style.display = holes.length === 1 ? '' : 'none'; });
      if (holes.length === 1) {
        const hole = holes[0];
        setRect(this.maskPanes.top, bounds.left, bounds.top, bounds.right, hole.top);
        setRect(this.maskPanes.right, hole.right, hole.top, bounds.right, hole.bottom);
        setRect(this.maskPanes.bottom, bounds.left, hole.bottom, bounds.right, bounds.bottom);
        setRect(this.maskPanes.left, bounds.left, hole.top, hole.left, hole.bottom);
      } else {
        const xs = [...new Set([bounds.left, bounds.right, ...holes.flatMap((hole) => [hole.left, hole.right])])]
          .sort((a, b) => a - b);
        const ys = [...new Set([bounds.top, bounds.bottom, ...holes.flatMap((hole) => [hole.top, hole.bottom])])]
          .sort((a, b) => a - b);
        for (let x = 0; x < xs.length - 1; x += 1) {
          for (let y = 0; y < ys.length - 1; y += 1) {
            const centerX = (xs[x] + xs[x + 1]) / 2;
            const centerY = (ys[y] + ys[y + 1]) / 2;
            const insideHole = holes.some((hole) => centerX >= hole.left && centerX <= hole.right
              && centerY >= hole.top && centerY <= hole.bottom);
            if (insideHole) continue;
            const pane = document.createElement('span');
            pane.className = 'mask-pane';
            pane.dataset.dynamicMask = 'true';
            this.mask.appendChild(pane);
            setRect(pane, xs[x], ys[y], xs[x + 1], ys[y + 1]);
          }
        }
      }

      // Reuse the existing ring pool. updateSpotlight runs after every scroll
      // and resize; cloning from only the primary ring would leak one extra DOM
      // node per event on every multi-region state.
      const rings = Array.from(this.mask.querySelectorAll('.spotlight-ring'));
      while (rings.length < holes.length) {
        const ring = this.spotlightRing.cloneNode(false);
        ring.removeAttribute('id');
        this.mask.appendChild(ring);
        rings.push(ring);
      }
      while (rings.length > holes.length && rings.length > 1) rings.pop().remove();
      rings.forEach((ring, index) => {
        ring.hidden = index >= holes.length;
        if (holes[index]) setRect(ring, holes[index].left, holes[index].top, holes[index].right, holes[index].bottom);
      });
    },

    focusView() {
      const target = this.viewport.querySelector('h1') || this.viewport;
      const temporaryViewportTabIndex = target === this.viewport && !target.hasAttribute('tabindex');
      if (temporaryViewportTabIndex) target.setAttribute('tabindex', '-1');
      target.focus({ preventScroll: true });
      if (temporaryViewportTabIndex) target.removeAttribute('tabindex');
    }
  };

  FlowPrototype.init();
</script>
</body>
</html>
