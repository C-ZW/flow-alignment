<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replace with the flow title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    /* ---- Sketchbook design system. Adjust product markup, keep these tokens. ---- */
    :root {
      --ink: #27272a; --ink-soft: #71717a; --line: #52525b; --paper: #f8f8f6;
      --spotlight: #fbbf24; --danger: #b91c1c;
      --sketch-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh; font-size: 18px; color: var(--ink);
      display: grid; grid-template-columns: 264px minmax(0, 1fr);
      background-color: var(--paper);
      background-image: radial-gradient(#d4d4d8 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      font-family: 'Patrick Hand', 'Comic Neue', cursive;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    /* ---- Observer rail. Tooling, not product: system typography, own column. ---- */
    .observer-hud {
      position: sticky; top: 0; align-self: start; z-index: 100;
      height: 100vh; overflow-y: auto; padding: 14px 13px;
      display: grid; gap: 13px; align-content: start;
      color: #fafafa; background: #18181b; border-right: 3px solid var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hud-section { display: grid; gap: 5px; }
    .hud-label { color: #a1a1aa; font: 700 11px/1.4 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .hud-select { width: 100%; padding: 5px 7px; font-size: 13px; color: #fff; background: #27272a; border: 1px solid var(--ink-soft); border-radius: 5px; }
    .hud-flow-title { font: 700 14px/1.4 system-ui, sans-serif; }
    /* The stepper doubles as observer navigation: each step jumps straight to that state. */
    .stepper { display: grid; gap: 3px; }
    .step { display: flex; gap: 6px; padding: 5px 9px; text-align: left; font: 600 13px/1.4 system-ui, sans-serif; color: #d4d4d8; background: transparent; border: 1px solid transparent; border-radius: 6px; }
    /* Alternative outcomes of one step are siblings, not consecutive steps. */
    .step[data-branch="true"] { margin-left: 13px; }
    .step-mark { flex: none; width: 13px; color: #71717a; }
    .step-name { flex: 1 1 auto; }
    body[data-present="true"] .hud-internal { display: none; }
    .step:hover { color: #fff; background: #27272a; }
    .step[data-active="true"] { color: #18181b; background: var(--spotlight); border-color: var(--spotlight); }
    .hud-text { margin: 0; font-size: 13px; line-height: 1.55; color: #e4e4e7; }
    .hud-details { display: grid; gap: 9px; margin: 0; padding-top: 10px; border-top: 1px solid #3f3f46; }
    .hud-controls { display: flex; gap: 7px; flex-wrap: wrap; padding-top: 11px; border-top: 1px solid #3f3f46; }
    .hud-button { flex: 1 1 auto; padding: 5px 10px; font: 600 13px/1.4 system-ui, sans-serif; color: #fafafa; background: #27272a; border: 1px solid #52525b; border-radius: 5px; }
    .hud-button:hover { border-color: #a1a1aa; }
    .hud-button[aria-pressed="true"], .hud-button[aria-expanded="true"] { color: #18181b; background: var(--spotlight); border-color: var(--spotlight); }
    [hidden] { display: none !important; }

    /* ---- Product shell. Context around the flow; live only when a state says so. ---- */
    .app-shell { width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 18px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
    .sketch-card { background: #fff; border: 2px solid var(--ink); border-radius: var(--sketch-radius); box-shadow: 2px 3px 0 rgba(0, 0, 0, .08); }
    .product-context { opacity: .5; pointer-events: none; user-select: none; }
    .shell-header { grid-column: 1 / -1; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; }
    .shell-nav { padding: 15px; min-height: 400px; display: grid; align-content: start; gap: 2px; }
    .shell-link { padding: 8px 10px; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px dashed #a1a1aa; cursor: default; }
    /* A link that leads somewhere in this step says so. The session exists to walk
       the flow, so a participant should not get stuck poking at dead chrome. */
    .shell-link[data-live="true"] { cursor: pointer; }
    .shell-link[data-live="true"]:hover { background: #fef3c7; }

    /* ---- Interaction scope. The mask marks the screen under test; while the
       participant is still navigating there is no mask at all, because a mask
       around the shell would itself tell them where to look. ---- */
    #product-viewport {
      position: relative; z-index: 10; min-height: 520px; padding: 28px; background: #fff;
      border: 3px solid var(--ink); border-radius: var(--sketch-radius);
      box-shadow: 0 0 0 9999px rgba(39, 39, 42, .52), 0 0 0 5px var(--spotlight), 0 22px 45px rgba(0, 0, 0, .35);
    }
    body[data-scope="shell"] .product-context { opacity: 1; user-select: auto; }
    body[data-scope="shell"] #product-viewport { box-shadow: 2px 3px 0 rgba(0, 0, 0, .08); }
    /* Permission is granted to declared navigation controls only — never to the
       whole shell, which would make any future markup silently interactive. */
    body[data-scope="shell"] .product-context [data-nav] { pointer-events: auto; }

    .btn-sketch-primary, .btn-sketch-secondary, .btn-sketch-danger { padding: 7px 16px; border: 2px solid var(--ink); border-radius: var(--sketch-radius); box-shadow: 2px 2px 0 rgba(0, 0, 0, .18); }
    .btn-sketch-primary { color: #fff; background: #18181b; }
    .btn-sketch-secondary { color: var(--ink); background: #fff; }
    .btn-sketch-danger { color: var(--danger); background: #fff1f2; border-color: var(--danger); }

    /* ---- Product-specific additions go below this line. ---- */

    @media (max-width: 900px) {
      body { grid-template-columns: minmax(0, 1fr); }
      .observer-hud { position: static; height: auto; border-right: 0; border-bottom: 3px solid var(--ink); }
      .stepper { display: flex; overflow-x: auto; }
      .step { white-space: nowrap; border-color: #52525b; border-radius: 999px; }
    }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; padding: 18px 12px; }
      .shell-header { grid-column: auto; }
      .shell-nav { min-height: 0; grid-auto-flow: column; overflow-x: auto; }
      #product-viewport { padding: 22px 18px; min-height: 460px; }
    }
  </style>
</head>
<body>

<!-- ========================================================================
     OBSERVER HUD — facilitator only.
     Flow selector, hypothesis, task, success signal, stepper, instruction,
     reset, and error simulation live here and nowhere else.
     ======================================================================== -->
<aside class="observer-hud" id="observer-hud" aria-label="Flow navigator">
  <div class="hud-section">
    <span class="hud-label">流程 Flow</span>
    <select class="hud-select" id="flow-selector" aria-label="Select flow"></select>
    <span class="hud-flow-title" id="flow-title" hidden></span>
  </div>
  <nav class="stepper" id="state-stepper" aria-label="Jump to a step"></nav>
  <div class="hud-section hud-internal">
    <span class="hud-label">這一步 This step</span>
    <p class="hud-text" id="state-instruction"></p>
  </div>
  <div class="hud-section hud-internal">
    <span class="hud-label">情境 Scenario</span>
    <p class="hud-text" id="flow-task"></p>
  </div>
  <div class="hud-details hud-internal" id="hud-details" hidden>
    <div class="hud-section" id="hypothesis-block">
      <span class="hud-label">假說 Hypothesis</span>
      <p class="hud-text" id="flow-hypothesis"></p>
    </div>
    <div class="hud-section" id="success-block">
      <span class="hud-label">成功訊號 Success signal</span>
      <p class="hud-text" id="flow-success"></p>
    </div>
  </div>
  <div class="hud-controls">
    <button class="hud-button hud-internal" id="details-toggle" type="button" aria-expanded="false" aria-controls="hud-details">Brief</button>
    <button class="hud-button" id="error-toggle" type="button" aria-pressed="false">Error</button>
    <button class="hud-button" id="reset-flow" type="button">Reset</button>
    <button class="hud-button" id="present-toggle" type="button" aria-pressed="false" title="Hide internal notes for a client walkthrough">簡報</button>
  </div>
</aside>

<!-- ========================================================================
     PRODUCT SHELL — believable context, dimmed and non-interactive.
     Replace the copy with the real product's chrome. Add no data-goto here.
     ======================================================================== -->
<div class="app-shell" id="app-shell">
  <header class="sketch-card shell-header product-context">
    <strong>[PRODUCT LOGO]</strong>
    <button class="shell-link" type="button" data-nav="account">Workspace / account menu</button>
  </header>
  <nav class="sketch-card shell-nav product-context" aria-label="Product navigation">
    <button class="shell-link" type="button" data-nav="overview">Overview</button>
    <button class="shell-link" type="button" data-nav="target">Target area</button>
    <button class="shell-link" type="button" data-nav="records">Records</button>
    <button class="shell-link" type="button" data-nav="settings">Settings</button>
  </nav>
  <main id="product-viewport" aria-live="polite"></main>
</div>

<!-- ========================================================================
     SOURCE OF TRUTH — paste the exact contents of flow.json here.
     ======================================================================== -->
<script id="flow-spec" type="application/json">
{
  "version": 2,
  "flows": [
    {
      "id": "sample-flow",
      "title": "Replace with the journey name",
      "task": "Replace with the scenario: what the person is trying to do, and why.",
      "initialState": "app-home",
      "errorSimulation": {
        "supported": true,
        "label": "Replace with the failure the product would really show."
      },
      "states": [
        {
          "id": "app-home",
          "title": "App home",
          "step": 1,
          "scope": "shell",
          "navTargets": {
            "records": "record-list"
          },
          "instruction": "Start where a real user would be standing, not on the screen under discussion.",
          "transitions": [
            "record-list"
          ]
        },
        {
          "id": "record-list",
          "title": "Records",
          "step": 2,
          "scope": "shell",
          "navTargets": {
            "overview": "app-home"
          },
          "instruction": "The navigation that gets them there is part of what you are confirming.",
          "transitions": [
            "decision",
            "app-home"
          ]
        },
        {
          "id": "decision",
          "title": "The decision",
          "step": 3,
          "instruction": "This is the screen the flow exists to settle.",
          "transitions": [
            "done",
            "declined",
            "record-list"
          ]
        },
        {
          "id": "done",
          "title": "Confirmed",
          "step": 4,
          "terminal": true,
          "instruction": "What the product shows when they go ahead.",
          "transitions": [
            "record-list"
          ]
        },
        {
          "id": "declined",
          "title": "Backed out",
          "step": 4,
          "terminal": true,
          "instruction": "The other branch. Same step number, so the rail draws them as alternatives.",
          "transitions": [
            "record-list"
          ]
        }
      ]
    }
  ]
}
</script>

<!-- ========================================================================
     STATE VIEWS — one <template> per state, keyed by data-flow + data-state.
     hypothesis and successSignal are omitted above on purpose: fill them in only
     when the artifact will be used for a moderated participant session.
     Product copy and product actions only. Actions use data-goto="<state-id>"
     and every target must be a declared transition from that state.
     Add data-variant="error" for the view shown while error simulation is on.
     ======================================================================== -->
<div id="state-views" hidden>
  <template data-flow="sample-flow" data-state="app-home">
    <p class="view-eyebrow">Home</p>
    <h1 class="view-title">Replace with the product's home screen</h1>
    <div class="record"><span><strong>Something recent</strong><br><small>Believable, specific detail</small></span><span><small>Status</small></span></div>
    <p class="note">This step exists so the walker navigates to the flow instead of appearing inside it. The left navigation is live here.</p>
  </template>

  <template data-flow="sample-flow" data-state="record-list">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the list they arrive at</h1>
    <div class="record">
      <span><strong>The record this flow is about</strong><br><small>Specific enough to be wrong</small></span>
      <button class="btn-sketch-secondary" type="button" data-goto="decision">Open</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="decision">
    <p class="view-eyebrow">Records / Detail</p>
    <h1 class="view-title">Replace with the decision screen</h1>
    <p class="note">Put the trade-off, friction, or value proposition being confirmed right here, in product language.</p>
    <div class="actions">
      <button class="btn-sketch-primary" type="button" data-goto="done">Confirm</button>
      <button class="btn-sketch-danger" type="button" data-goto="declined">Decline</button>
      <button class="btn-sketch-secondary" type="button" data-goto="record-list">Go back</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="decision" data-variant="error">
    <p class="view-eyebrow">Records / Detail</p>
    <h1 class="view-title">Replace with the decision screen</h1>
    <p class="system-message">Replace with the failure message the product would really show.</p>
    <p class="note">Show how they recover, in the product's own words.</p>
    <div class="actions">
      <button class="btn-sketch-primary" type="button" data-goto="done">Try again</button>
      <button class="btn-sketch-secondary" type="button" data-goto="record-list">Go back</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="done">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the confirmed outcome</h1>
    <p class="note">State the result the way the product would, then offer a natural next step.</p>
    <div class="actions">
      <button class="btn-sketch-secondary" type="button" data-goto="record-list">Back to records</button>
    </div>
  </template>

  <template data-flow="sample-flow" data-state="declined">
    <p class="view-eyebrow">Records</p>
    <h1 class="view-title">Replace with the other outcome</h1>
    <p class="note">Every branch lands somewhere real. "What if they say no?" is the question the room always asks.</p>
    <div class="actions">
      <button class="btn-sketch-secondary" type="button" data-goto="record-list">Back to records</button>
    </div>
  </template>
</div>

<!-- ========================================================================
     ENGINE — generic and data driven. Do not edit when building a prototype.
     ======================================================================== -->
<script>
  const FlowPrototype = {
    spec: null,
    flowId: null,
    stateId: null,
    errorOn: false,

    init() {
      this.spec = JSON.parse(document.getElementById('flow-spec').textContent);
      this.selector = document.getElementById('flow-selector');
      this.stepper = document.getElementById('state-stepper');
      this.viewport = document.getElementById('product-viewport');
      this.shell = document.getElementById('app-shell');
      this.errorButton = document.getElementById('error-toggle');

      this.selector.innerHTML = this.spec.flows
        .map((flow) => `<option value="${flow.id}">${flow.title}</option>`)
        .join('');
      const single = this.spec.flows.length === 1;
      this.selector.hidden = single;
      document.getElementById('flow-title').hidden = !single;

      this.selector.addEventListener('change', () => this.selectFlow(this.selector.value));
      document.getElementById('reset-flow').addEventListener('click', () => this.selectFlow(this.flowId));

      // Observer navigation: every step in the HUD jumps straight to that state,
      // so a branch can be re-run without walking the flow from the beginning.
      this.stepper.addEventListener('click', (event) => {
        const step = event.target.closest('[data-jump]');
        if (step) this.jumpTo(step.dataset.jump);
      });

      const details = document.getElementById('hud-details');
      const presentToggle = document.getElementById('present-toggle');
      presentToggle.addEventListener('click', () => {
        const on = document.body.dataset.present !== 'true';
        document.body.dataset.present = String(on);
        presentToggle.setAttribute('aria-pressed', String(on));
      });

      const detailsToggle = document.getElementById('details-toggle');
      detailsToggle.addEventListener('click', () => {
        details.hidden = !details.hidden;
        detailsToggle.setAttribute('aria-expanded', String(!details.hidden));
      });

      this.errorButton.addEventListener('click', () => {
        this.errorOn = !this.errorOn;
        this.errorButton.setAttribute('aria-pressed', String(this.errorOn));
        this.render();
      });

      // Participant actions inside the page under test.
      this.viewport.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-goto]');
        if (trigger) this.goTo(trigger.dataset.goto);
      });

      // Product navigation. A shell link is live only where the current state
      // says it leads somewhere, so one shared shell serves every flow.
      this.shell.addEventListener('click', (event) => {
        const link = event.target.closest('[data-nav]');
        if (!link) return;
        const target = (this.state().navTargets || {})[link.dataset.nav];
        if (target) this.goTo(target);
      });

      this.selectFlow(this.spec.flows[0].id);
    },

    flow() {
      return this.spec.flows.find((flow) => flow.id === this.flowId);
    },

    state() {
      return this.flow().states.find((state) => state.id === this.stateId);
    },

    selectFlow(flowId) {
      const flow = this.spec.flows.find((item) => item.id === flowId);
      if (!flow) throw new Error(`Unknown flow: ${flowId}`);
      this.flowId = flow.id;
      this.stateId = flow.initialState;
      this.errorOn = false;
      this.selector.value = flow.id;
      this.errorButton.setAttribute('aria-pressed', 'false');
      this.errorButton.hidden = !(flow.errorSimulation && flow.errorSimulation.supported);
      this.errorButton.title = (flow.errorSimulation && flow.errorSimulation.label) || '';
      document.title = flow.title;
      document.getElementById('flow-title').textContent = flow.title;
      document.getElementById('flow-task').textContent = flow.task;
      // Hypothesis and success signal are optional: a flow being confirmed with a
      // client has a scenario, not a research question.
      document.getElementById('flow-hypothesis').textContent = flow.hypothesis || '';
      document.getElementById('flow-success').textContent = flow.successSignal || '';
      document.getElementById('hypothesis-block').hidden = !flow.hypothesis;
      document.getElementById('success-block').hidden = !flow.successSignal;
      document.getElementById('details-toggle').hidden = !(flow.hypothesis || flow.successSignal);
      this.render();
    },

    // The participant path. Only transitions the specification declares.
    goTo(stateId) {
      const current = this.state();
      if (!current.transitions.includes(stateId)) {
        throw new Error(`Undeclared transition: ${current.id} -> ${stateId}`);
      }
      this.stateId = stateId;
      this.render();
    },

    // An observer control, deliberately not bound by the transition graph.
    jumpTo(stateId) {
      if (!this.flow().states.some((state) => state.id === stateId)) {
        throw new Error(`Unknown state: ${stateId}`);
      }
      this.stateId = stateId;
      this.render();
    },

    render() {
      const flow = this.flow();
      const state = this.state();
      document.getElementById('state-instruction').textContent = state.instruction;
      // Steps that share a number are alternative outcomes, not sequential steps.
      const ordered = flow.states.slice().sort((a, b) => a.step - b.step);
      const counts = ordered.reduce((all, item) => ({ ...all, [item.step]: (all[item.step] || 0) + 1 }), {});
      let seen = {};
      this.stepper.innerHTML = ordered
        .map((item) => {
          const branch = counts[item.step] > 1;
          seen[item.step] = (seen[item.step] || 0) + 1;
          const last = seen[item.step] === counts[item.step];
          const mark = branch ? (last ? '└' : '├') : `${item.step}.`;
          return `<button class="step" type="button" data-jump="${item.id}" data-branch="${branch}" data-active="${item.id === state.id}">`
            + `<span class="step-mark">${mark}</span><span class="step-name">${item.title}</span></button>`;
        })
        .join('');

      // Interaction scope for this state, and which shell links lead somewhere.
      document.body.dataset.scope = state.scope === 'shell' ? 'shell' : 'viewport';
      const navTargets = state.navTargets || {};
      document.querySelectorAll('[data-nav]').forEach((link) => {
        link.dataset.live = String(Boolean(navTargets[link.dataset.nav]));
      });

      const selector = `template[data-flow="${flow.id}"][data-state="${state.id}"]`;
      const view = (this.errorOn && document.querySelector(`${selector}[data-variant="error"]`))
        || document.querySelector(`${selector}:not([data-variant])`);
      if (!view) throw new Error(`Missing state view: ${flow.id}/${state.id}`);
      this.viewport.replaceChildren(view.content.cloneNode(true));
    }
  };

  FlowPrototype.init();
</script>
</body>
</html>
