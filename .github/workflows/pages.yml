name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "prototypes/behind-your-day-purchase/prototype.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Prepare standalone demo
        run: |
          mkdir _site
          cp prototypes/behind-your-day-purchase/prototype.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
